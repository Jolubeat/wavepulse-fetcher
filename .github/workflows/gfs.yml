name: gfs
# World wind and waves for the maps, from NOAA GFS / GFS-Wave (see gfs_grid.py). Every 6 h, ~4.5 h after each model
# cycle (00/06/12/18 UTC) is published. ~20 small NOMADS requests, 10 s apart. 0 Open-Meteo requests.
on:
  schedule:
    - cron: '35 4,10,16,22 * * *'
  workflow_dispatch:
concurrency: { group: gfs, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  gfs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet numpy pygrib
      - run: python gfs_grid.py
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
