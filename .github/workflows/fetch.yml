name: fetch
# Every hour, a slice of the WavePulse forecast requests (see fetch.mjs). Free on public repositories.
on:
  schedule:
    - cron: '41 * * * *'   # minute 41 (UTC): off the round hour and away from the server's own schedule (minute 17)
  workflow_dispatch:
    inputs:
      hour:
        description: 'Test: run the slice of this UTC hour (0-23); empty = the current hour'
        required: false
concurrency: { group: fetch, cancel-in-progress: false }
permissions: { contents: write }  # write: only for the monthly heartbeat commit below
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node fetch.mjs
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          FORCE_HOUR: ${{ github.event.inputs.hour }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # GitHub disables scheduled workflows after 60 days without repository activity (docs.github.com, 2026-11-23):
      # on the 1st of each month, at 04:41 UTC, a one-line commit keeps the repository active.
      - name: monthly heartbeat
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H)" = "0104" ]; then
            date -u +%Y-%m-%dT%H:%MZ > heartbeat.txt
            git config user.name "wavepulse-fetcher"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add heartbeat.txt && git commit -m "heartbeat" && git push
          fi
